<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Optimizasyon Aracı</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 90%;
        max-width: 400px;
      }
      h1 {
        color: #1f2937;
        margin-bottom: 0.5rem;
        font-size: 1.5rem;
      }
      p {
        color: #6b7280;
        margin-bottom: 2rem;
      }
      .btn {
        background: #4f46e5;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        cursor: pointer;
        border: none;
        transition: 0.2s;
      }
      .btn:hover {
        background: #4338ca;
      }
      .hidden {
        display: none;
      }
      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #4f46e5;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        margin: 1rem auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .stats {
        background: #ecfdf5;
        color: #065f46;
        padding: 0.5rem;
        border-radius: 0.5rem;
        margin-top: 1rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PDF Optimize</h1>
      <p>Dosya boyutunu kaliteden ödün vermeden küçültün.</p>

      <div id="uploadSection">
        <input
          type="file"
          id="fileInput"
          accept="application/pdf"
          style="display: none"
        />
        <button
          class="btn"
          onclick="document.getElementById('fileInput').click()"
        >
          📂 PDF Seç
        </button>
      </div>

      <div id="processSection" class="hidden">
        <div class="spinner"></div>
        <div id="statusText">İşleniyor...</div>
      </div>

      <div id="resultSection" class="hidden">
        <div id="statsBox" class="stats"></div>
        <br />
        <a id="downloadLink" href="#" class="btn">⬇️ İndir</a>
        <br /><br />
        <button
          class="btn"
          style="background: #9ca3af"
          onclick="location.reload()"
        >
          Yeni Dosya
        </button>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");

      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById("uploadSection").classList.add("hidden");
        document.getElementById("processSection").classList.remove("hidden");

        const formData = new FormData();
        formData.append("pdf", file);

        try {
          const res = await fetch("/upload", {
            method: "POST",
            body: formData,
          });

          // Yanıt JSON mu kontrol et
          const contentType = res.headers.get("content-type");
          if (!contentType || !contentType.includes("application/json")) {
            throw new Error(
              "Sunucu JSON yerine HTML döndürdü. Muhtemelen 500 veya 413 hatası."
            );
          }

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || "Sunucu hatası");
          }

          checkStatus(data.job_id);
        } catch (err) {
          alert("Yükleme Hatası: " + err.message);
          location.reload();
        }
      });

      function checkStatus(jobId) {
        const interval = setInterval(async () => {
          try {
            const res = await fetch(`/status/${jobId}`);
            const data = await res.json();

            if (data.stage === "completed") {
              clearInterval(interval);
              document.getElementById("processSection").classList.add("hidden");
              document
                .getElementById("resultSection")
                .classList.remove("hidden");
              document.getElementById(
                "statsBox"
              ).innerHTML = `Orijinal: ${data.stats.original} <br> Yeni: ${data.stats.optimized}`;
              document.getElementById("downloadLink").href = data.url;
            } else if (data.stage === "error") {
              clearInterval(interval);
              alert("İşlem Hatası: " + (data.message || "Bilinmeyen hata"));
              location.reload();
            }
          } catch (e) {
            clearInterval(interval);
            console.log(e);
          }
        }, 1000);
      }
    </script>
  </body>
</html>
